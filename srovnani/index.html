<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Tržní srovnání — Forum Karlín</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--teal:#1F9C86;--teal-dark:#13705F;--teal-deep:#0C463D;--coral:#EE8763;--ink:#16241F;--ink-soft:#42514B;--paper:#FBFAF7;--line:#E6E1D8;--card:#fff;--err:#C2410C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0F1A17;--card:#17241F;--ink:#E6ECE9;--ink-soft:#9AA8A1;--line:#2C3632;--teal-dark:#5CC4A4;--err:#FB8A4F}}
:root[data-theme="dark"]{--paper:#0F1A17;--card:#17241F;--ink:#E6ECE9;--ink-soft:#9AA8A1;--line:#2C3632;--teal-dark:#5CC4A4;--err:#FB8A4F}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--paper);color:var(--ink);font:16px/1.55 'Manrope',-apple-system,'Segoe UI',sans-serif}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;box-shadow:0 10px 30px rgba(12,70,61,.10)}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 .76rem 'Sora',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-dark);margin-bottom:14px}
.tri{width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent var(--coral)}
h1{font:700 1.6rem/1.15 'Sora',sans-serif;letter-spacing:-.02em}
p{color:var(--ink-soft);margin-top:10px;font-size:.95rem}
form{margin-top:26px;display:grid;gap:12px}
label{font-weight:600;font-size:.88rem}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
input:focus{outline:none;border-color:var(--teal)}
button{font:700 .95rem 'Manrope',sans-serif;padding:13px 24px;border:none;border-radius:999px;background:var(--coral);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;font-size:.88rem;color:var(--err);font-weight:600}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow"><span class="tri"></span> Důvěrné</div>
  <h1>Tržní srovnání<br>Forum Karlín</h1>
  <p>Dokument je chráněný heslem. Zadejte heslo, které jste obdrželi od Avison Young.</p>
  <form id="f">
    <label for="pw">Heslo</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus />
    <button id="go" type="submit">Zobrazit</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</main>
